terms.read=Leer condiciones y privacidad
terms.text=Condiciones de TentTrack\n\nUna reserva ocupa todo el camping durante las fechas seleccionadas. La llegada es inclusiva y la salida exclusiva. Las tarifas son en LKR por persona y noche. La tarifa se guarda al confirmar.\n\nEsta aplicación registra reservas y estimaciones. No cobra pagos, emite reembolsos ni añade impuestos. El resumen no es un comprobante de pago. Los clientes pueden cancelar antes de su estancia, incluido el día de llegada. Los administradores pueden cancelar una estancia que no haya terminado.\n\nPrivacidad\n\nEl nombre, correo, usuario, hash de contraseña, reservas y comentarios se guardan en la base local. No se recopilan tarjetas, direcciones IP ni historial de navegación. Los administradores pueden consultar reservas y comentarios. Protege el acceso al dispositivo y a sus copias de seguridad.
