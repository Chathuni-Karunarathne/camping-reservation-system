terms.text=TentTrack booking terms\n\nA reservation secures the entire campsite for the selected dates. Arrival is inclusive; departure is exclusive. Prices are in LKR per person per night. The rate is stored when the reservation is confirmed.\n\nThis desktop application records reservations and estimates. It does not collect payments, issue refunds, or add taxes. Your booking summary is not proof of payment. Customers may cancel before their stay begins, including arrival day. Administrators may cancel a stay that has not ended.\n\nPrivacy\n\nYour name, email, username, password hash, reservations and feedback are stored in the local database. The app does not collect payment-card details, IP addresses or browsing history. Administrators can review reservations and feedback. Protect access to the device and its database backups.
